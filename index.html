<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目管理系统</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>
    <div class="app-shell">
      <aside class="sidebar">
        <h1>项目管理系统</h1>
        <nav id="navMenu" class="menu"></nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <h2 id="viewTitle">仪表盘</h2>
            <p id="viewSubtitle">项目全局状态和关键指标</p>
          </div>
          <div class="topbar-actions">
            <button id="exportDataBtn" class="btn ghost">导出数据</button>
            <label class="btn ghost" style="margin:0;cursor:pointer;">
              导入数据
              <input id="importDataInput" type="file" accept=".json" style="display:none" />
            </label>
            <button id="resetDataBtn" class="btn ghost">重置示例数据</button>
          </div>
        </header>

        <div id="toast" class="toast hidden"></div>

        <section id="dashboardView" class="view"></section>
        <section id="projectsView" class="view hidden"></section>
        <section id="tasksView" class="view hidden"></section>
        <section id="boardView" class="view hidden"></section>
        <section id="calendarView" class="view hidden"></section>
        <section id="ganttView" class="view hidden"></section>
        <section id="milestonesView" class="view hidden"></section>
        <section id="teamView" class="view hidden"></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
